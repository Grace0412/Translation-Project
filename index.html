<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Translator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Voice Translator</h1>
      <p class="subtitle">Type text, pick a language, hear it spoken — with a map of where it's spoken.</p>
    </header>

    <main class="main">
      <section class="panel translate-panel">
        <label class="label" for="source-text">What would you like to translate?</label>
        <textarea
          id="source-text"
          class="textarea"
          rows="4"
          placeholder="Type or paste your sentence here…"
        ></textarea>

        <div class="controls">
          <div class="field">
            <label class="label" for="target-lang">Translate to</label>
            <select id="target-lang" class="select"></select>
          </div>

          <button id="translate-btn" type="button" class="btn btn-primary">
            Translate
          </button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>

        <div id="result-block" class="result-block" hidden>
          <label class="label">Translation</label>
          <p id="translated-text" class="translated-text"></p>
          <div class="result-actions">
            <button id="speak-btn" type="button" class="btn btn-secondary">
              <span aria-hidden="true">🔊</span> Read aloud
            </button>
            <button id="stop-speak-btn" type="button" class="btn btn-ghost" hidden>
              Stop
            </button>
          </div>
        </div>
      </section>

      <section class="panel map-panel">
        <div class="map-header">
          <h2 id="map-title">Map</h2>
          <p id="map-subtitle" class="map-subtitle">Select a language to see where it's spoken.</p>
        </div>
        <div id="map" class="map" role="img" aria-label="Map of the selected language region"></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
